<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8CCD2"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="steelInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="60%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="70%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
  </defs>

  <!-- HACHAS CRUZADAS (atrás) -->
  <!-- Mango izquierdo -->
  <g transform="translate(100 110) rotate(-20)">
    <rect x="-5" y="-90" width="10" height="180" fill="url(#wood)" rx="2"/>
    <!-- Cabeza de hacha izquierda (arriba) -->
    <g transform="translate(0 -85)">
      <path d="M-30 -10 L-30 10 L0 8 L0 -8 Z" fill="url(#redGrad)"/>
      <path d="M-30 -10 L-40 0 L-30 10 Z" fill="url(#redGrad)" opacity="0.9"/>
      <!-- Filo brillante -->
      <path d="M-40 0 L-30 -10 L-32 -12 L-42 -2 Z" fill="#FCA5A5" opacity="0.6"/>
      <!-- Líneas de detalle -->
      <line x1="-25" y1="-5" x2="-25" y2="5" stroke="#7F1D1D" stroke-width="0.5" opacity="0.6"/>
      <line x1="-20" y1="-6" x2="-20" y2="6" stroke="#7F1D1D" stroke-width="0.5" opacity="0.6"/>
    </g>
    <!-- Cabeza de hacha izquierda (abajo) -->
    <g transform="translate(0 85) scale(1 -1)">
      <path d="M-30 -10 L-30 10 L0 8 L0 -8 Z" fill="url(#redGrad)"/>
      <path d="M-30 -10 L-40 0 L-30 10 Z" fill="url(#redGrad)" opacity="0.9"/>
      <path d="M-40 0 L-30 -10 L-32 -12 L-42 -2 Z" fill="#FCA5A5" opacity="0.6"/>
    </g>
  </g>

  <!-- Mango derecho -->
  <g transform="translate(100 110) rotate(20)">
    <rect x="-5" y="-90" width="10" height="180" fill="url(#wood)" rx="2"/>
    <!-- Cabeza de hacha derecha (arriba) -->
    <g transform="translate(0 -85) scale(-1 1)">
      <path d="M-30 -10 L-30 10 L0 8 L0 -8 Z" fill="url(#redGrad)"/>
      <path d="M-30 -10 L-40 0 L-30 10 Z" fill="url(#redGrad)" opacity="0.9"/>
      <path d="M-40 0 L-30 -10 L-32 -12 L-42 -2 Z" fill="#FCA5A5" opacity="0.6"/>
      <line x1="-25" y1="-5" x2="-25" y2="5" stroke="#7F1D1D" stroke-width="0.5" opacity="0.6"/>
      <line x1="-20" y1="-6" x2="-20" y2="6" stroke="#7F1D1D" stroke-width="0.5" opacity="0.6"/>
    </g>
    <!-- Cabeza de hacha derecha (abajo) -->
    <g transform="translate(0 85) scale(-1 -1)">
      <path d="M-30 -10 L-30 10 L0 8 L0 -8 Z" fill="url(#redGrad)"/>
      <path d="M-30 -10 L-40 0 L-30 10 Z" fill="url(#redGrad)" opacity="0.9"/>
      <path d="M-40 0 L-30 -10 L-32 -12 L-42 -2 Z" fill="#FCA5A5" opacity="0.6"/>
    </g>
  </g>

  <!-- ESCUDO PRINCIPAL -->
  <g transform="translate(100 110)">
    <!-- Borde externo del escudo -->
    <path d="M -55 -55
             L 55 -55
             Q 68 -50 70 -30
             L 70 30
             Q 68 50 55 55
             L 40 65
             Q 0 80 -40 65
             L -55 55
             Q -68 50 -70 30
             L -70 -30
             Q -68 -50 -55 -55 Z"
          fill="url(#steel)" stroke="#4B5563" stroke-width="1.5"/>

    <!-- Borde interno -->
    <path d="M -48 -48
             L 48 -48
             Q 60 -44 62 -28
             L 62 28
             Q 60 44 48 48
             L 36 57
             Q 0 70 -36 57
             L -48 48
             Q -60 44 -62 28
             L -62 -28
             Q -60 -44 -48 -48 Z"
          fill="none" stroke="#374151" stroke-width="0.8"/>

    <!-- Banda superior "ANCÓN" -->
    <path d="M -48 -48 Q 0 -55 48 -48 L 48 -35 L -48 -35 Z"
          fill="url(#redGrad)" stroke="#7F1D1D" stroke-width="0.5"/>
    <text x="0" y="-40" text-anchor="middle"
          font-family="Georgia, serif" font-size="10" font-weight="700"
          fill="#FEF2F2" letter-spacing="1.5">ANCÓN</text>

    <!-- Marco interior óvalo (cielo) -->
    <ellipse cx="0" cy="5" rx="40" ry="35" fill="url(#skyGrad)"/>

    <!-- Sol -->
    <circle cx="18" cy="-10" r="9" fill="url(#sun)"/>
    <circle cx="18" cy="-10" r="5" fill="#FBBF24" opacity="0.6"/>

    <!-- Edificios de Ancón (silueta) -->
    <g fill="#525252">
      <rect x="-30" y="8" width="8" height="20"/>
      <rect x="-20" y="4" width="6" height="24"/>
      <rect x="-12" y="10" width="7" height="18"/>
      <rect x="-3" y="2" width="8" height="26"/>
      <rect x="7" y="12" width="6" height="16"/>
      <rect x="15" y="5" width="7" height="23"/>
      <rect x="24" y="10" width="6" height="18"/>
      <!-- Torre/iglesia -->
      <polygon points="-3,2 1,-4 5,2"/>
      <polygon points="15,5 18,-2 22,5"/>
    </g>

    <!-- Mar (olas) -->
    <path d="M -38 24 Q -30 22 -22 24 T -6 24 T 10 24 T 26 24 T 38 24 L 38 35 L -38 35 Z"
          fill="#2563EB" opacity="0.85"/>
    <path d="M -38 28 Q -30 26 -22 28 T -6 28 T 10 28 T 26 28 T 38 28"
          stroke="#DBEAFE" stroke-width="0.6" fill="none" opacity="0.8"/>

    <!-- Delfín -->
    <g transform="translate(-8 16)">
      <!-- Cuerpo del delfín saltando -->
      <path d="M -14 0 Q -10 -8 0 -10 Q 10 -10 14 -4 Q 16 0 14 4 Q 10 6 4 6 Q -2 8 -8 6 Q -12 4 -14 0 Z"
            fill="#1F2937"/>
      <!-- Aleta superior -->
      <path d="M 2 -9 L 5 -14 L 8 -9 Z" fill="#1F2937"/>
      <!-- Cola -->
      <path d="M -14 0 L -20 -3 L -18 0 L -20 3 Z" fill="#1F2937"/>
      <!-- Ojo -->
      <circle cx="8" cy="-3" r="0.8" fill="#F9FAFB"/>
      <!-- Brillo/highlight -->
      <path d="M -8 -5 Q 0 -8 8 -6" stroke="#6B7280" stroke-width="0.6" fill="none" opacity="0.5"/>
    </g>

    <!-- "163" en la parte inferior -->
    <g transform="translate(0 58)">
      <rect x="-20" y="-8" width="40" height="16" rx="2" fill="url(#redGrad)" stroke="#7F1D1D" stroke-width="0.5"/>
      <text x="0" y="4" text-anchor="middle"
            font-family="Georgia, serif" font-size="14" font-weight="900"
            fill="#FEF2F2" letter-spacing="1">163</text>
    </g>

    <!-- Highlights metálicos -->
    <path d="M -55 -55 L 55 -55 Q 68 -50 70 -30"
          stroke="#F3F4F6" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M -55 -55 Q -65 -48 -68 -35"
          stroke="#F3F4F6" stroke-width="0.8" fill="none" opacity="0.4"/>
  </g>

  <!-- Hidrante pequeño a la izquierda (detalle del original) -->
  <g transform="translate(30 125) scale(0.5)">
    <rect x="-6" y="0" width="12" height="22" rx="1" fill="url(#redGrad)" stroke="#7F1D1D" stroke-width="0.5"/>
    <rect x="-8" y="-2" width="16" height="4" fill="url(#redGrad)" stroke="#7F1D1D" stroke-width="0.5"/>
    <circle cx="0" cy="-5" r="3" fill="url(#redGrad)" stroke="#7F1D1D" stroke-width="0.5"/>
    <rect x="-10" y="8" width="4" height="3" fill="#7F1D1D"/>
    <rect x="6" y="8" width="4" height="3" fill="#7F1D1D"/>
  </g>
</svg>
